---
# teleport-dev: an exec-in dev environment for the OIDC fork. Mirrors docmost-dev.
# `kubectl exec -n teleport-dev deploy/teleport-dev -- bash` then run claude / git /
# build-teleport.sh. Source lives on the workspace PVC; home (Claude Code login,
# shell history) persists on the home PVC.
apiVersion: v1
kind: Namespace
metadata:
  name: teleport-dev
  labels:
    app.kubernetes.io/part-of: teleport-fork
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teleport-dev
  namespace: teleport-dev
---
# Hot-swap perms in the teleport namespace (build-teleport.sh: cp binary + SIGHUP)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teleport-dev-swap
  namespace: teleport
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-dev-swap
  namespace: teleport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teleport-dev-swap
subjects:
  - kind: ServiceAccount
    name: teleport-dev
    namespace: teleport-dev
---
# Full control within its own namespace (so Claude Code can manage dev resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-dev-admin
  namespace: teleport-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: teleport-dev
    namespace: teleport-dev
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-credentials
  namespace: teleport-dev
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-backend
  refreshInterval: 1h
  target:
    name: harbor-registry-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"repos.eu-central-1.myidp.cloud":{"username":"admin","password":"{{ .password }}","auth":"{{ printf "admin:%s" .password | b64enc }}"}}}
  data:
    - secretKey: password
      remoteRef:
        key: harbor/admin
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teleport-dev-workspace
  namespace: teleport-dev
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: rook-cephfs
  resources:
    requests:
      storage: 40Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teleport-dev-home
  namespace: teleport-dev
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: rook-cephfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleport-dev
  namespace: teleport-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: teleport-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teleport-dev
    spec:
      serviceAccountName: teleport-dev
      imagePullSecrets:
        - name: harbor-registry-credentials
      # Run as the non-root dev user (uid/gid 1000, baked into the image). fsGroup makes
      # newly-written volume files group-1000; OnRootMismatch avoids re-chowning the
      # whole 40Gi workspace on every mount.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # One-time migration: the PVCs were first populated while the pod ran as root,
        # so chown their contents to the dev user. Runs as root; idempotent — skips when
        # the mount root is already 1000-owned, so it's a fast no-op on later restarts.
        - name: fix-perms
          image: repos.eu-central-1.myidp.cloud/teleport/teleport-dev:dev
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - 'for d in /home/dev /workspace; do [ "$(stat -c %u "$d")" = 1000 ] || { echo "chown -R 1000:1000 $d"; chown -R 1000:1000 "$d"; }; done'
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: home
              mountPath: /home/dev
      containers:
        - name: dev
          image: repos.eu-central-1.myidp.cloud/teleport/teleport-dev:dev
          imagePullPolicy: Always
          stdin: true
          tty: true
          # entrypoint clones the fork into /workspace, then dev-start.sh builds+runs
          # teleport (self-daemonizes, exits 0); sleep infinity keeps the pod alive.
          # Restart with: kubectl exec -it <pod> -- /workspace/teleport/dev-restart.sh
          command: ["/usr/local/bin/teleport-dev-entrypoint.sh"]
          args: ["/bin/sh", "-c", "/workspace/teleport/dev-start.sh || true; exec sleep infinity"]
          ports:
            - name: web
              containerPort: 3080
          env:
            - name: HOME
              value: /home/dev
            - name: WORKSPACE_DIR
              value: /workspace
            - name: GIT_BRANCH
              value: orvex
            - name: CLAUDE_REMOTE_ACCESSIBLE
              value: "true"
            - name: KEYCLOAK_HOST
              value: auth.eu-central-1.myidp.cloud
            - name: TELEPORT_DEV_HOST
              value: tp-dev.eu-central-1.myidp.cloud
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: teleport-oidc-secret
                  key: client_secret
            # DB + S3 creds (optional: the build pod still starts before CNPG/OBC
            # provision; teleport picks them up on the next restart once present).
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: teleport-db-app
                  key: password
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: teleport-dev-sessions-bucket
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: teleport-dev-sessions-bucket
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            # Build caches on the 40Gi workspace PVC so they survive restarts (the
            # buildbox defaults put GOMODCACHE/CARGO_HOME on ephemeral image paths).
            - name: GOCACHE
              value: /workspace/.cache/go-build
            - name: GOMODCACHE
              value: /workspace/.cache/go-mod
            - name: CARGO_HOME
              value: /workspace/.cache/cargo
            - name: GOFLAGS
              value: "-p=8"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: home
              mountPath: /home/dev
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              # Matches the prod teleport-build pipeline — make full (Rust + Go + web
              # UI in parallel) peaks well above 10Gi and will OOM otherwise.
              cpu: "11"
              memory: 24Gi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: teleport-dev-workspace
        - name: home
          persistentVolumeClaim:
            claimName: teleport-dev-home
---
# OIDC client secret (Keycloak teleport client) — consumed by dev-start.sh's
# _apply_oidc_connector to create the connector via tctl.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teleport-oidc-credentials
  namespace: teleport-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: teleport-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        client_secret: "{{ .client_secret }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/teleport-oidc
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: v1
kind: Service
metadata:
  name: teleport-dev
  namespace: teleport-dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teleport-dev
  ports:
    - name: web
      port: 3080
      targetPort: web
---
# Web/OIDC exposure via Traefik (Cloudflare-proxied, like docmost-dev). teleport runs
# with --insecure-no-tls behind this; TLS is terminated at the gateway. tsh/SSH would
# need the dedicated-LB path (prod) — this dev route is for the web OIDC flow.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: teleport-dev
  namespace: teleport-dev
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "tp-dev.eu-central-1.myidp.cloud"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    external-dns.alpha.kubernetes.io/target: "37.27.73.18"
spec:
  hostnames:
    - tp-dev.eu-central-1.myidp.cloud
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
      namespace: traefik
      sectionName: websecure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: teleport-dev
          port: 3080
          weight: 1
---
# Postgres backend for the dev teleport (pgbk + pgevents). CNPG creates teleport-db-app
# (password → PGPASSWORD). Single instance (dev-grade).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: teleport-db
  namespace: teleport-dev
spec:
  instances: 1
  # CNPG + wal2json (pgbk change feed needs it) — built by deploy/dev/cnpg-wal2json.
  imageName: repos.eu-central-1.myidp.cloud/teleport/postgresql-wal2json:18.1-trixie  # CHECKED: 2026-05-25
  imagePullSecrets:
    - name: harbor-registry-credentials
  bootstrap:
    initdb:
      database: teleport
      owner: teleport
  managed:
    roles:
      - name: teleport
        ensure: present
        login: true
        replication: true
  storage:
    storageClass: rook-ceph-block-xfs
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  postgresql:
    parameters:
      wal_level: "logical"
      max_connections: "200"
---
# S3 bucket (Ceph RGW) for the dev teleport's session recordings → secret
# teleport-dev-sessions-bucket (AWS creds). Distinct bucket name from prod.
apiVersion: platform.myidp.io/v1alpha1
kind: ObjectStorageClaim
metadata:
  name: teleport-dev-sessions
  namespace: teleport-dev
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  bucketName: teleport-dev-sessions
  maxSize: "50Gi"
  maxObjects: "1000000"
