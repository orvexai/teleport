---
# teleport-dev: an exec-in dev environment for the OIDC fork. Mirrors docmost-dev.
# `kubectl exec -n teleport-dev deploy/teleport-dev -- bash` then run claude / git /
# build-teleport.sh. Source lives on the workspace PVC; home (Claude Code login,
# shell history) persists on the home PVC.
apiVersion: v1
kind: Namespace
metadata:
  name: teleport-dev
  labels:
    app.kubernetes.io/part-of: teleport-fork
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teleport-dev
  namespace: teleport-dev
---
# Hot-swap perms in the teleport namespace (build-teleport.sh: cp binary + SIGHUP)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teleport-dev-swap
  namespace: teleport
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-dev-swap
  namespace: teleport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teleport-dev-swap
subjects:
  - kind: ServiceAccount
    name: teleport-dev
    namespace: teleport-dev
---
# Full control within its own namespace (so Claude Code can manage dev resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-dev-admin
  namespace: teleport-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: teleport-dev
    namespace: teleport-dev
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-registry-credentials
  namespace: teleport-dev
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-backend
  refreshInterval: 1h
  target:
    name: harbor-registry-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"repos.eu-central-1.myidp.cloud":{"username":"admin","password":"{{ .password }}","auth":"{{ printf "admin:%s" .password | b64enc }}"}}}
  data:
    - secretKey: password
      remoteRef:
        key: harbor/admin
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teleport-dev-workspace
  namespace: teleport-dev
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: rook-cephfs
  resources:
    requests:
      storage: 40Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: teleport-dev-home
  namespace: teleport-dev
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: rook-cephfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleport-dev
  namespace: teleport-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: teleport-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teleport-dev
    spec:
      serviceAccountName: teleport-dev
      imagePullSecrets:
        - name: harbor-registry-credentials
      containers:
        - name: dev
          image: repos.eu-central-1.myidp.cloud/teleport/teleport-dev:dev
          imagePullPolicy: Always
          env:
            - name: HOME
              value: /home/dev
            - name: WORKSPACE_DIR
              value: /workspace
            - name: GIT_BRANCH
              value: orvex
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: home
              mountPath: /home/dev
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "6"
              memory: 10Gi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: teleport-dev-workspace
        - name: home
          persistentVolumeClaim:
            claimName: teleport-dev-home
