# Dev teleport config — standalone auth+proxy, run by dev-start.sh/prod-start.sh
# inside the teleport-dev pod with `--insecure-no-tls` (TLS is terminated at the
# Traefik HTTPRoute, like docmost-dev). public_addr is the external dev hostname so
# OIDC redirect URLs + web sessions resolve correctly behind the ingress.
version: v3
teleport:
  nodename: tp-dev
  data_dir: /home/dev/teleport-data
  log:
    output: stderr
    severity: INFO
  # Postgres backend (pgbk state + pgevents audit) + S3 session recordings, mirroring
  # prod. Password comes from PGPASSWORD env (set on the dev pod from the CNPG secret),
  # so it stays out of this file.
  storage:
    type: postgresql
    conn_string: "postgresql://teleport@teleport-db-rw.teleport-dev.svc:5432/teleport?sslmode=require&pool_max_conns=20"
    change_feed_conn_string: "postgresql://teleport@teleport-db-rw.teleport-dev.svc:5432/teleport?sslmode=require&pool_max_conns=10"
    audit_events_uri:
      - "postgres://teleport@teleport-db-rw.teleport-dev.svc:5432/teleport?sslmode=require"
    audit_sessions_uri: "s3://teleport-dev-sessions?endpoint=rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80&region=us-east-1&insecure=true&disablesse=true"

auth_service:
  enabled: true
  cluster_name: tp-dev.eu-central-1.myidp.cloud
  listen_addr: 0.0.0.0:3025
  # separate (not multiplex): the dev proxy runs --insecure-no-tls behind Traefik
  # (TLS terminated at the HTTPRoute). multiplex builds a TLS-ALPN/SNI listener that
  # teleport only creates when TLS is enabled, so with --insecure-no-tls it is nil
  # → "listener cannot be nil". Prod keeps multiplex (it terminates its own TLS).
  proxy_listener_mode: separate
  authentication:
    type: local
    second_factors: ["otp", "webauthn"]
    # webauthn requires rp_id = the web origin's host (no scheme/port); must match
    # proxy_service.public_addr's host or registered authenticators won't validate.
    webauthn:
      rp_id: tp-dev.eu-central-1.myidp.cloud

proxy_service:
  enabled: true
  # External address (via the Traefik HTTPRoute) — drives OIDC redirect_url + cookies.
  public_addr: tp-dev.eu-central-1.myidp.cloud:443
  web_listen_addr: 0.0.0.0:3080
  # In separate mode under --insecure-no-tls these listeners are NOT folded into the
  # web port (multiplex does that, but it needs TLS). The proxy always starts its SSH
  # and reverse-tunnel servers, so without explicit addrs listeners.ssh/reverseTunnel
  # are nil → "listener cannot be nil" (reverse tunnel) / nil deref (sshGRPC). Only
  # :3080 is exposed via the HTTPRoute; :3023/:3024 just satisfy the proxy internally.
  listen_addr: 0.0.0.0:3023
  tunnel_listen_addr: 0.0.0.0:3024

ssh_service:
  enabled: false
