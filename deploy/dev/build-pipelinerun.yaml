---
# Builds + pushes repos-direct.eu-central-1.myidp.cloud/teleport/teleport-dev:dev from
# the orvex branch. Run with: kubectl create -f deploy/dev/build-pipelinerun.yaml
#
# Local-only, no Ceph: it's an ephemeral build pod. A single buildah step uses buildah's
# native git context (clones the repo itself — no separate clone task, so no cross-pod
# source PVC) and stores layers on a local emptyDir at /var/lib/containers. buildah uses
# privileged NATIVE kernel overlayfs (no fuse-overlayfs / no /dev/fuse), which works on
# any node (kernel >= 5.11); the emptyDir sits on the node's ext4, which supports an
# overlay upperdir. The only mounted secret is the registry auth for the push.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: teleport-dev-build-
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/name: teleport-dev-build
    app.kubernetes.io/part-of: teleport-fork
spec:
  taskRunTemplate:
    serviceAccountName: tekton-smoke-test-builder
  workspaces:
    - name: dockerconfig
      secret:
        secretName: tekton-harbor-credentials
  pipelineSpec:
    workspaces:
      - name: dockerconfig
    tasks:
      - name: build-image
        workspaces:
          - name: dockerconfig
            workspace: dockerconfig
        taskSpec:
          workspaces:
            - name: dockerconfig
              optional: true
          volumes:
            # buildah's container/layer storage — local node disk, not Ceph.
            - name: varlibcontainers
              emptyDir: {}
          steps:
            - name: build-and-push
              image: quay.io/buildah/stable:v1.42.2
              # privileged + root → CAP_SYS_ADMIN for native kernel overlay mounts.
              securityContext:
                privileged: true
                runAsUser: 0
              env:
                - name: STORAGE_DRIVER
                  value: overlay
                - name: BUILDAH_FORMAT
                  value: oci
              computeResources:
                requests:
                  cpu: "2"
                  memory: 4Gi
                limits:
                  cpu: "8"
                  memory: 16Gi
              volumeMounts:
                - name: varlibcontainers
                  mountPath: /var/lib/containers
              script: |
                #!/bin/bash
                set -eu
                if [ -d "$(workspaces.dockerconfig.path)" ]; then
                  export REGISTRY_AUTH_FILE=$(workspaces.dockerconfig.path)/.dockerconfigjson
                fi
                IMAGE=repos-direct.eu-central-1.myidp.cloud/teleport/teleport-dev:dev
                echo "Building $IMAGE from orvex (native overlay, local emptyDir storage)"
                buildah bud \
                  --format=oci \
                  --tls-verify=false \
                  --layers \
                  -f deploy/dev/Dockerfile \
                  -t "$IMAGE" \
                  "https://github.com/orvexai/teleport.git#orvex"
                echo "Pushing $IMAGE"
                buildah push --tls-verify=false "$IMAGE" "docker://$IMAGE"
                echo "Done: $IMAGE"
