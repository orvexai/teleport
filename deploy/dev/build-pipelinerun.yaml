---
# Builds the teleport-dev image (deploy/dev/Dockerfile) and pushes
#   repos-direct.eu-central-1.myidp.cloud/teleport/teleport-dev:dev
# Self-contained (inline pipelineSpec) so it doesn't disturb the main teleport-build
# pipeline. Run with: kubectl create -f deploy/dev/build-pipelinerun.yaml
# Caches are emptyDir (single source PVC) to avoid the multi-PVC TaskRun limit.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: teleport-dev-build-
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/name: teleport-dev-build
    app.kubernetes.io/part-of: teleport-fork
spec:
  taskRunTemplate:
    serviceAccountName: tekton-smoke-test-builder
    # buildah falls back to fuse-overlayfs (cephfs/overlay-on-overlay can't do native
    # overlay), so the build pod MUST land on a node that has the fuse module + /dev/fuse.
    # node-5 lacks it ("fuse: device not found"); node-1/node-4 have it (where the
    # teleport-build pipeline succeeds). Pin to a known-good node. fsGroup 1000 lets the
    # buildah user write the cephfs build-cache PVC (matches teleport-build's podTemplate).
    podTemplate:
      securityContext:
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/hostname: node-4.eu-central-1.myidp.cloud
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteMany"]
          resources:
            requests:
              storage: 10Gi
          storageClassName: rook-cephfs
    - name: dockerconfig
      secret:
        secretName: tekton-harbor-credentials
    # build-cache backs buildah's /var/lib/containers. It MUST be a real PVC, not an
    # emptyDir: an emptyDir lands on the node's overlay rootfs, so buildah falls back to
    # fuse-overlayfs (needs /dev/fuse, absent here → "fuse: device not found"). A cephfs
    # PVC lets it work like the teleport-build pipeline. Per-run template (no shared
    # state, won't collide with concurrent teleport-build runs).
    - name: build-cache
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteMany"]
          resources:
            requests:
              storage: 30Gi
          storageClassName: rook-cephfs
  pipelineSpec:
    workspaces:
      - name: source
      - name: dockerconfig
      - name: build-cache
    tasks:
      - name: clone-repo
        taskRef:
          name: git-clone
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: https://github.com/orvexai/teleport.git
          - name: revision
            value: orvex
          - name: deleteExisting
            value: "true"
      - name: build-and-push
        runAfter: [clone-repo]
        taskRef:
          name: buildah-with-args
        workspaces:
          - name: source
            workspace: source
          - name: dockerconfig
            workspace: dockerconfig
          - name: build-cache
            workspace: build-cache
        params:
          - name: IMAGE
            value: "repos-direct.eu-central-1.myidp.cloud/teleport/teleport-dev:dev"
          - name: DOCKERFILE
            value: "deploy/dev/Dockerfile"
          - name: CONTEXT
            value: "."
          - name: TLS_VERIFY
            value: "false"
