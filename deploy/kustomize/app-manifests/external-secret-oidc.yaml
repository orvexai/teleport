---
# OIDC client secret (Keycloak teleport client) — consumed by dev-start.sh to
# create the connector via tctl.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teleport-oidc-credentials
  namespace: teleport-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: teleport-oidc-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        client_secret: "{{ .client_secret }}"
  data:
    - secretKey: client_secret
      remoteRef:
        key: keycloak/teleport-oidc
        property: client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
