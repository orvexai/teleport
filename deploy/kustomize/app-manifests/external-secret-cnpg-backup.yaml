---
# Backblaze B2 credentials for CNPG WAL archiving / base backups (offsite DR).
# Shared platform path — same treatment as harbor/admin above.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backblaze-backup
  namespace: teleport-dev
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-backend
  refreshInterval: 1h
  target:
    name: cnpg-backblaze-backup
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: backblaze/cnpg-backup
        property: AWS_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: backblaze/cnpg-backup
        property: AWS_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
