---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teleport-dev
  namespace: teleport-dev
---
# Hot-swap perms in the teleport namespace (dev-start.sh: cp binary + SIGHUP)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teleport-dev-swap
  namespace: teleport
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-dev-swap
  namespace: teleport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teleport-dev-swap
subjects:
  - kind: ServiceAccount
    name: teleport-dev
    namespace: teleport-dev
---
# Full control within its own namespace (so Claude Code can manage dev resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teleport-dev-admin
  namespace: teleport-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: teleport-dev
    namespace: teleport-dev
