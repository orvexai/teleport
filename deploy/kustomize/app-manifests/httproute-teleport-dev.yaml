---
# Web/OIDC exposure via Traefik (Cloudflare DNS-only, no proxy). Teleport runs
# --insecure-no-tls behind this; TLS is terminated at the gateway.
# tsh/SSH needs the dedicated-LB path (prod) — this dev route is for OIDC/web.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: teleport-dev
  namespace: teleport-dev
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    external-dns.alpha.kubernetes.io/hostname: "tp-dev.eu-central-1.myidp.cloud"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/target: "37.27.73.18"
spec:
  hostnames:
    - tp-dev.eu-central-1.myidp.cloud
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-gateway
      namespace: traefik
      sectionName: tp-dev-websecure
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: teleport-dev
          port: 3080
          weight: 1
