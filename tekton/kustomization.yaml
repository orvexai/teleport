---
# CI resources that belong in the cluster (namespace tekton-pipelines).
# Lets these be applied as a unit, either via GitOps (an ArgoCD Application
# pointed at this path) or directly: `kubectl apply -k deploy/tekton`.
#
# Deliberately excluded:
#   - Dockerfile                       (build input, not a k8s resource)
#   - teleport-build-pipelinerun.yaml  (manual one-shot run via generateName;
#                                        `kubectl create -f`, not synced by ArgoCD)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tekton-pipelines

resources:
  - build-cache-pvc.yaml
  - buildah-with-args-task.yaml
  - teleport-build-pipeline.yaml
  - trigger.yaml
