---
# Buildah task with --build-arg support.
# Copied from web-ai-classification-engine/deploy/tekton/buildah-with-args-task.yaml
# so this repo's pipeline is self-contained. If that Task is already applied to
# the cluster's tekton-pipelines namespace, applying this is a harmless no-op
# (identical object).
#
# The only teleport-specific change vs. the original is the addition of
# computeResources on the build step — a full Teleport build is far heavier than
# the classify images this Task was written for.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah-with-args
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/name: buildah-with-args
    app.kubernetes.io/component: build
    app.kubernetes.io/part-of: teleport-fork
  annotations:
    tekton.dev/categories: Image Build
    tekton.dev/displayName: Buildah with Build Args
spec:
  description: Build a container image using Buildah with support for build arguments

  params:
    - name: IMAGE
      description: Image name and tag
      type: string

    - name: DOCKERFILE
      description: Path to Dockerfile
      type: string
      default: ./Dockerfile

    - name: CONTEXT
      description: Build context directory
      type: string
      default: .

    - name: BUILD_ARG_1
      description: "Build argument 1 (format: KEY=VALUE)"
      type: string
      default: ""

    - name: BUILD_ARG_2
      description: "Build argument 2 (format: KEY=VALUE)"
      type: string
      default: ""

    - name: BUILD_ARG_3
      description: "Build argument 3 (format: KEY=VALUE)"
      type: string
      default: ""

    - name: BUILD_ARG_4
      description: "Build argument 4 (format: KEY=VALUE)"
      type: string
      default: ""

    - name: TLS_VERIFY
      description: "Verify TLS certificates for registry (set false for internal repos-direct)"
      type: string
      default: "true"

  results:
    - name: IMAGE_DIGEST
      description: Digest of the built image
      type: string

    - name: IMAGE_URL
      description: URL of the pushed image
      type: string

  workspaces:
    - name: source
      description: Source code with Dockerfile

    - name: dockerconfig
      description: Docker config with registry credentials
      optional: true

    - name: build-cache
      description: Persistent Go module + build cache (ReadWriteMany PVC). When
        bound, mounted at /tmp/ci/go inside every RUN step via buildah --volume.
      optional: true

    - name: github-netrc
      description: Optional secret workspace containing a ".netrc" key. When
        bound, passed to buildah as `--secret id=github-netrc` so a Dockerfile
        RUN can `--mount=type=secret,id=github-netrc,dst=/root/.netrc` to fetch
        private repos / Go modules (e.g. github.com/orvexai/*). The token never
        lands in an image layer. Unbound = no change (backward compatible).
      optional: true

  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.42.2
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
        runAsUser: 1000
      # A full Teleport build (Go + Rust + web UI) is memory- and CPU-hungry.
      # Tune to your nodes / namespace LimitRange; these are a sane starting point.
      computeResources:
        requests:
          cpu: "4"
          memory: 8Gi
        limits:
          cpu: "11"
          memory: 24Gi
      env:
        - name: STORAGE_DRIVER
          value: overlay
        - name: BUILDAH_FORMAT
          value: oci
      script: |
        #!/bin/bash
        set -eu

        # ── Tekton param capture ─ do NOT inline param tokens below this block ───
        # Tekton substitutes its param tokens as RAW TEXT into this script before bash
        # parses it. A value that came from a task RESULT carries a trailing newline
        # (Tekton does not strip it), so inlining one mid-command silently SPLITS the
        # command across lines.
        #
        # That is what broke omnigent-app-build on 2026-09-18: the IMAGE token on the
        # `-t` flag became two lines, so `buildah bud` ended early and SUCCEEDED (built
        # and tagged), then the orphaned continuation ran onto the CONTEXT line, leaving
        # a bare `.` that bash ran as the source builtin:
        #     line 122: .: filename argument required   -> exit 2, nothing pushed
        # NOTE: no param token may appear in these comments either - Tekton has no
        # concept of a bash comment and substitutes there too, which reintroduces
        # the very split this block prevents (caught in review, 2026-09-18).
        # Pipelines passing only pipeline params (e.g. docmost) were unaffected, making
        # it look app-specific instead of a bug in this shared Task.
        #
        # A QUOTED heredoc makes each value literal (no $, backtick or quote handling)
        # and command substitution strips trailing newlines. Use ONLY these variables.
        IMAGE="$(cat <<'TEKTON_PARAM_EOF_8f21c7d4'
        $(params.IMAGE)
        TEKTON_PARAM_EOF_8f21c7d4
        )"
        DOCKERFILE="$(cat <<'TEKTON_PARAM_EOF_8f21c7d4'
        $(params.DOCKERFILE)
        TEKTON_PARAM_EOF_8f21c7d4
        )"
        CONTEXT="$(cat <<'TEKTON_PARAM_EOF_8f21c7d4'
        $(params.CONTEXT)
        TEKTON_PARAM_EOF_8f21c7d4
        )"
        TLS_VERIFY="$(cat <<'TEKTON_PARAM_EOF_8f21c7d4'
        $(params.TLS_VERIFY)
        TEKTON_PARAM_EOF_8f21c7d4
        )"
        BUILD_ARG_1="$(cat <<'TEKTON_PARAM_EOF_8f21c7d4'
        $(params.BUILD_ARG_1)
        TEKTON_PARAM_EOF_8f21c7d4
        )"
        BUILD_ARG_2="$(cat <<'TEKTON_PARAM_EOF_8f21c7d4'
        $(params.BUILD_ARG_2)
        TEKTON_PARAM_EOF_8f21c7d4
        )"
        BUILD_ARG_3="$(cat <<'TEKTON_PARAM_EOF_8f21c7d4'
        $(params.BUILD_ARG_3)
        TEKTON_PARAM_EOF_8f21c7d4
        )"
        BUILD_ARG_4="$(cat <<'TEKTON_PARAM_EOF_8f21c7d4'
        $(params.BUILD_ARG_4)
        TEKTON_PARAM_EOF_8f21c7d4
        )"


        # emptyDir for the live buildah store — fresh every run, no shared mutable
        # state, no lock leaks, no disk growth. The buildbox image is cached as an
        # OCI layout on the PVC and imported at startup so each build reads from
        # local disk rather than pulling from the registry.
        mkdir -p /var/lib/containers/storage
        cat > /tmp/storage.conf <<STOREOF
        [storage]
        driver = "overlay"
        graphRoot = "/var/lib/containers/storage"
        runRoot   = "/tmp/containers-run"
        [storage.options.overlay]
        ignore_chown_errors = "true"
        STOREOF
        export CONTAINERS_STORAGE_CONF=/tmp/storage.conf

        # Route ghcr.io pulls through the in-cluster Harbor proxy cache so cold
        # runs hit LAN speeds instead of the public internet.
        cat > /tmp/registries.conf <<REGEOF
        unqualified-search-registries = []
        short-name-mode = "disabled"

        [[registry]]
        prefix   = "ghcr.io"
        location = "ghcr.io"
        insecure = false

        [[registry.mirror]]
        location = "repos-direct.eu-central-1.myidp.cloud/ghcr-cache"
        insecure = false
        REGEOF
        export CONTAINERS_REGISTRIES_CONF=/tmp/registries.conf

        # Pre-warm the local store from the PVC OCI cache. On first run: pull from
        # registry, write to temp dir, atomic rename → cache. Concurrent first runs:
        # one wins the rename; others proceed with the registry pull (safe fallback).
        # BUILDBOX_OCI_DIR is on the PVC (workspaces.build-cache.path), NOT /tmp/ci —
        # that path only exists inside the buildah container, not the pod itself.
        BUILDBOX_REF="ghcr.io/gravitational/teleport-buildbox:teleport19"
        BUILDBOX_OCI_DIR="$(workspaces.build-cache.path)/buildbox-oci"

        if [ "$(workspaces.build-cache.bound)" == "true" ] && [ -f "${BUILDBOX_OCI_DIR}/index.json" ]; then
          echo "Importing buildbox from PVC OCI cache..."
          buildah pull "oci:${BUILDBOX_OCI_DIR}"
        else
          echo "No PVC cache found — pulling buildbox from registry..."
          buildah pull "${BUILDBOX_REF}"
          if [ "$(workspaces.build-cache.bound)" == "true" ]; then
            OCI_TMP=$(mktemp -d "$(workspaces.build-cache.path)/buildbox-oci-XXXXXX")
            if buildah push "${BUILDBOX_REF}" "oci:${OCI_TMP}"; then
              mv "${OCI_TMP}" "${BUILDBOX_OCI_DIR}" 2>/dev/null || rm -rf "${OCI_TMP}"
              echo "Buildbox cached to PVC."
            else
              rm -rf "${OCI_TMP}"
              echo "Cache write skipped (non-fatal)."
            fi
          fi
        fi

        # Setup registry auth if provided
        if [ -d "$(workspaces.dockerconfig.path)" ]; then
          export REGISTRY_AUTH_FILE=$(workspaces.dockerconfig.path)/.dockerconfigjson
        fi

        # Build build-arg flags from params as an array, not a string. A plain
        # string built here and later expanded unquoted word-splits on ANY
        # whitespace, including whitespace inside a single build-arg's VALUE —
        # turning it into extra stray positional args for `buildah bud` (which
        # accepts at most one, the context dir). That's the exact cause of
        # "Error: accepts at most 1 arg(s), received 6". An array + quoted
        # expansion keeps each "--build-arg KEY=VALUE" pair intact regardless
        # of spaces in VALUE.
        BUILD_ARGS=()
        [ -n "$BUILD_ARG_1" ] && BUILD_ARGS+=(--build-arg "$BUILD_ARG_1")
        [ -n "$BUILD_ARG_2" ] && BUILD_ARGS+=(--build-arg "$BUILD_ARG_2")
        [ -n "$BUILD_ARG_3" ] && BUILD_ARGS+=(--build-arg "$BUILD_ARG_3")
        [ -n "$BUILD_ARG_4" ] && BUILD_ARGS+=(--build-arg "$BUILD_ARG_4")

        # Mount the entire /tmp/ci tree from the persistent PVC.
        # This covers GOPATH+GOCACHE (/tmp/ci/go), CARGO_HOME (/tmp/ci/rust),
        # and the Yarn classic cache ($HOME/.cache/yarn = /tmp/ci/.cache/yarn).
        # fsGroup: 1000 in the pod template makes the PVC root writable.
        CACHE_VOLUME=""
        if [ "$(workspaces.build-cache.bound)" == "true" ]; then
          CACHE_VOLUME="--volume $(workspaces.build-cache.path):/tmp/ci:rw"
          echo "Build cache: $(workspaces.build-cache.path) -> /tmp/ci (go + rust + yarn)"
        fi

        # Optional GitHub .netrc as a build secret. A Dockerfile RUN opts in with
        # `--mount=type=secret,id=github-netrc,dst=/root/.netrc` to authenticate
        # private repo / Go module fetches. --secret is ephemeral (never written
        # to an image layer). Unbound = flag omitted, no behavior change.
        NETRC_SECRET=""
        if [ "$(workspaces.github-netrc.bound)" == "true" ]; then
          NETRC_SECRET="--secret id=github-netrc,src=$(workspaces.github-netrc.path)/.netrc"
          echo "GitHub netrc: exposing build secret 'github-netrc' for private fetches"
        fi

        echo "Building image: $IMAGE"
        echo "Dockerfile: $DOCKERFILE"
        echo "Context: $CONTEXT"
        echo "Build args: ${BUILD_ARGS[*]}"
        echo ""

        # Build the image
        buildah bud \
          --format=oci \
          --tls-verify="$TLS_VERIFY" \
          --pull=missing \
          --layers \
          "${BUILD_ARGS[@]}" \
          ${CACHE_VOLUME} \
          ${NETRC_SECRET} \
          -f "$DOCKERFILE" \
          -t "$IMAGE" \
          "$CONTEXT"

        # Push the image
        echo ""
        echo "Pushing image to registry..."
        buildah push \
          --tls-verify="$TLS_VERIFY" \
          --digestfile /tmp/image-digest \
          "$IMAGE" \
          "docker://$IMAGE"

        # Output results
        cat /tmp/image-digest | tee $(results.IMAGE_DIGEST.path)
        printf '%s' "$IMAGE" > $(results.IMAGE_URL.path)

        echo ""
        echo "Successfully built and pushed $IMAGE"

      volumeMounts:
        - name: varlibcontainers
          mountPath: /var/lib/containers

  volumes:
    - name: varlibcontainers
      emptyDir: {}
