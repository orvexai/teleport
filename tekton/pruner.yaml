---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-pruner
  namespace: tekton-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-pruner
  namespace: tekton-pipelines
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-pruner
  namespace: tekton-pipelines
subjects:
  - kind: ServiceAccount
    name: tekton-pruner
    namespace: tekton-pipelines
roleRef:
  kind: Role
  name: tekton-pruner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tekton-pruner
  namespace: tekton-pipelines
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: tekton-pruner
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: tekton-harbor-credentials
          containers:
            - name: pruner
              image: repos.eu-central-1.myidp.cloud/dockerhub-cache/alpine/k8s:1.36.1
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  KEEP=3
                  NS=tekton-pipelines

                  echo "=== PipelineRun pruner: keeping newest $KEEP COMPLETED runs (in-flight runs are never pruned) ==="

                  # Emit "name<TAB>conditionStatus", oldest-first.
                  # Tekton PipelineRun .status.conditions[0].status:
                  #   True    -> Succeeded (completed)
                  #   False   -> Failed    (completed)
                  #   Unknown -> Running/Pending (in-flight)   <-- MUST NOT be deleted
                  #   ""      -> just created, no status yet (in-flight) <-- MUST NOT be deleted
                  ALL=$(kubectl get pipelinerun -n $NS \
                    --sort-by=.metadata.creationTimestamp \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.conditions[0].status}{"\n"}{end}')

                  # Keep only completed runs as prune candidates; skip Unknown/empty (in-flight).
                  COMPLETED=$(echo "$ALL" | awk -F'\t' '$2=="True" || $2=="False" { print $1 }')

                  TOTAL=$(echo "$COMPLETED" | grep -c . || true)
                  echo "Found $TOTAL completed PipelineRuns (in-flight runs excluded from pruning)"

                  if [ "$TOTAL" -le "$KEEP" ]; then
                    echo "Nothing to prune."
                    exit 0
                  fi

                  # Delete all but the newest $KEEP completed runs; in-flight runs were never candidates.
                  TO_DELETE=$(echo "$COMPLETED" | head -n "-$KEEP")
                  COUNT=$(echo "$TO_DELETE" | grep -c . || true)
                  echo "Deleting $COUNT old completed PipelineRuns..."
                  echo "$TO_DELETE" | xargs kubectl delete pipelinerun -n $NS
                  echo "Done."
